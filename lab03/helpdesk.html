<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <a href="https://www.swinburne.edu.au/" target="_blank"><img src="logo.png" alt="Swinburne University Logo"></a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ACT620. Open 10:30 to 19:00 Monday to Friday.</p>
    <p>Check Blackboards for when CWA tutors will be there.</p>
    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
        <fieldset>
            <legend>Student details</legend>
            <p>
                <label for="S_id">Student ID</label>
                <input type="text" id="S_id" name="S_id"/>
            </p>
            <p>
                <label for="Gname">Given Name</label>
                <input type="text" id="Gname" name="Gname"/>
                <label for="Fname">Family Name</label>
                <input type="text" id="Fname" name="Fname"/>
            </p>
        </fieldset>
        <fieldset>
            <legend>Your Unit</legend>
            <p>
                <input type="radio" id="COS10011" name="unit" value="COS10011" required/>
                <label for="COS10011">COS10011</label>
                <input type="radio" id="COS60004" name="unit" value="COS60004"/>
                <label for="COS60004">COS60004</label>
                <input type="radio" id="COS60007" name="unit" value="COS60007"/>
                <label for="COS60007">COS60007</label>
            </p>
            <p>
                <label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor">
                    <option value="">Please select</option>
                    <option>Wilson Doan</option>
                    <option>Nghia Quach</option>
                    <option>Jenny PDeng</option>
                </select>
            </p>
        </fieldset>
        <fieldset>
            <legend>Issue</legend>
            <p>
                <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" name="issue[]" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="jarva_script" name="issue[]" value="jarva_script">
                <label for="jarva_script">Jarva Script</label>
                <input type="checkbox" id="php" name="issue[]" value="php">
                <label for="php">PHP</label>
                <input type="checkbox" id="sql" name="issue[]" value="sql">
                <label for="sql">MySQL</label>
            </p>
            <p> <label for="DoI">Description of Issue</label></p>
            <textarea id="DoI" name="DoI" rows="4" cols="40">Write the description of your problem here...
            </textarea>
        </fieldset>
        <fieldset>
            <legend>Preferred Date/Time</legend>
            <p>
                <label for="Pdate">Date</label>
                <input type="text" id="Pdate" pattern="^\d{2}/\d{2}/\d{4}$" name="Pdate" placeholder="dd/mm/yyy"/>
            </p>
            <p>
                <label for="Ptime">Time</label>
                <input type="text" id="Ptime" pattern="^\d{2}:\d{2}$" name="Ptime" placeholder="00:00"/>
            </p>
        </fieldset>
        <input type="submit" value="Book"> 
        <input type="reset" value="Reset form"> 
    </form>
</body>
</html>
